<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- WIJAIJOY: a magnifying glass (research) whose lens is a thumbstick cap (joy).
       Built-in SMIL motion (works inside <img>): pulsing dot, scan line, rising bubbles. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff8e"/>
      <stop offset="0.55" stop-color="#22d3c5"/>
      <stop offset="1" stop-color="#a855ff"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855ff"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#1d2a24"/>
      <stop offset="1" stop-color="#070b09"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39ff8e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#39ff8e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff8e" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#39ff8e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b9ffd6" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="54" cy="54" r="36"/>
    </clipPath>
  </defs>

  <!-- handle -->
  <line x1="84" y1="84" x2="113" y2="113" stroke="url(#handle)" stroke-width="15" stroke-linecap="round"/>
  <line x1="88" y1="88" x2="110" y2="110" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
  <rect x="76" y="76" width="16" height="9" rx="3" transform="rotate(45 84 80.5)" fill="#22d3c5"/>

  <!-- lens rim -->
  <circle cx="54" cy="54" r="40" fill="#060a08"/>
  <circle cx="54" cy="54" r="40" fill="none" stroke="url(#ring)" stroke-width="8"/>

  <!-- thumbstick cap inside the lens -->
  <circle cx="54" cy="54" r="26" fill="url(#cap)" stroke="#2b3b33" stroke-width="2"/>
  <circle cx="54" cy="54" r="18" fill="none" stroke="#39ff8e" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 4"/>
  <g stroke="#39ff8e" stroke-width="3" stroke-linecap="round">
    <line x1="54" y1="22" x2="54" y2="30"/>
    <line x1="54" y1="78" x2="54" y2="86"/>
    <line x1="22" y1="54" x2="30" y2="54"/>
    <line x1="78" y1="54" x2="86" y2="54"/>
  </g>

  <!-- scan line sweeping down the lens -->
  <g clip-path="url(#lens)">
    <rect x="16" y="-6" width="76" height="14" fill="url(#scan)">
      <animate attributeName="y" values="4;92;4" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </rect>
  </g>

  <!-- glowing centre dot (heartbeat) -->
  <circle cx="54" cy="54" r="14" fill="url(#glow)">
    <animate attributeName="r" values="11;17;11" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="54" cy="54" r="5.5" fill="#39ff8e">
    <animate attributeName="r" values="5;6.8;5" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- glass glint flicker -->
  <path d="M28 40 A30 30 0 0 1 44 24" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.55;0.15;0.55;0.55" keyTimes="0;0.1;0.2;1" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- lab bubbles rising and fading -->
  <circle cx="104" cy="28" r="5" fill="none" stroke="#39ff8e" stroke-width="2.5">
    <animate attributeName="cy" values="34;6" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="116" cy="40" r="3" fill="#a855ff">
    <animate attributeName="cy" values="46;14" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="96" cy="14" r="2.5" fill="#22d3c5">
    <animate attributeName="cy" values="24;0" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
